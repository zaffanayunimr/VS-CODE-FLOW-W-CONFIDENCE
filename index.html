<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Penjagaan Haid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fullscreen Button -->
    <button id="fullscreen-btn" class="icon-btn">⛶</button>

    <!-- 1. START OVERLAY -->
    <div id="start-overlay" class="overlay">
        <button id="start-app-btn" class="main-btn">MULA APLIKASI</button>
    </div>

    <!-- VIDEO INTRO PLAYERS -->
    <video id="videoPlayer1" src="assets/comp1.mp4" muted playsinline></video>
    <video id="videoPlayer2" src="assets/intro.mp4" muted playsinline></video>

    <!-- 2. LANGUAGE SELECTION OVERLAY -->
    <div id="language-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2>Pilih Bahasa / Select Language</h2>
            <div class="button-group">
                <button id="btn-bm" class="main-btn">Bahasa Melayu</button>
                <button id="btn-en" class="main-btn">English</button>
            </div>
        </div>
    </div>

    <button id="skip-btn" class="secondary-btn" style="display: none;">Langkau</button>

    <!-- GLOBAL NAVIGATION CONTROLS -->
    <div id="global-controls" style="display: none;">
        <button id="btn-global-home" class="icon-btn">🏠</button>
        <button id="btn-global-back" class="icon-btn">⬅️</button>
        <button id="btn-global-settings" class="icon-btn">⚙️</button>
        <button id="btn-global-hint" class="icon-btn" style="display: none;">💡</button>
    </div>

    <!-- 3. SCENE 4 OVERLAY (MAIN MENU) -->
    <div id="scene4-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h1>Menu Utama</h1>
            <div class="button-group">
                <button id="btn-chapter" class="main-btn">Bab</button>
                <button id="btn-quiz" class="main-btn">Kuiz</button>
            </div>
        </div>
    </div>

    <!-- 4. SCENE 6 OVERLAY (CHAPTER MENU) -->
    <div id="scene6-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2 id="chapter-title">Bab Penjagaan Haid</h2>
            <div class="button-group">
                <button id="btn-asas" class="main-btn"><span id="label-asas">Asas</span></button>
                <button id="btn-penjagaan" class="main-btn"><span id="label-penjagaan">Penjagaan</span></button>
                <button id="btn-kesihatan" class="main-btn"><span id="label-kesihatan">Kesihatan & Kesedaran</span></button>
            </div>
        </div>
    </div>

    <!-- 5. SCENE 7 OVERLAY (BAB ASAS) -->
    <div id="scene7-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2 id="asas-title">Asas</h2>
            <div class="button-grid">
                <button id="btn-apa-haid" class="sub-btn"><span id="label-apa-haid">Apakah itu haid?</span></button>
                <button id="btn-mengapa-haid" class="sub-btn"><span id="label-mengapa-haid">Mengapa haid berlaku?</span></button>
                <button id="btn-berapa-lama" class="sub-btn"><span id="label-berapa-lama">Berapa lamakah kitaran haid?</span></button>
                <button id="btn-normal-lawan" class="sub-btn"><span id="label-normal-lawan">Normal lawan tidak normal</span></button>
            </div>
        </div>
    </div>

    <!-- 6. SCENE 8 OVERLAY (BAB PENJAGAAN) -->
    <div id="scene8-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2 id="penjagaan-title">Penjagaan</h2>
            <div class="button-grid">
                <button id="btn-penjagaan-asas" class="sub-btn"><span id="label-penjagaan-asas">Penjagaan asas semasa haid</span></button>
                <button id="btn-penjagaan-haid" class="sub-btn"><span id="label-penjagaan-haid">Penjagaan haid di sekolah</span></button>
                <button id="btn-jenis-produk" class="sub-btn"><span id="label-jenis">Jenis-jenis tuala wanita</span></button>
                <button id="btn-cara-guna" class="sub-btn"><span id="label-cara">Cara mengurangkan sakit senggugut</span></button>
            </div>
        </div>
    </div>

    <!-- 7. SCENE 9 OVERLAY (BAB KESIHATAN) -->
    <div id="scene9-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2 id="kesihatan-title">Kesihatan & Kesedaran</h2>
            <div class="button-grid">
                <button id="btn-haid-mental" class="sub-btn"><span id="label-haid-mental">Haid & kesihatan mental</span></button>
                <button id="btn-mitos-fakta" class="sub-btn"><span id="label-mitos-fakta">Mitos & fakta</span></button>
                <button id="btn-kesilapan-kebersihan" class="sub-btn"><span id="label-kesilapan-kebersihan">Kesilapan kebersihan semasa haid</span></button>
                <button id="btn-sekeliling" class="sub-btn"><span id="label-sekeliling">Penjagaan haid kepada orang sekeliling</span></button>
            </div>
        </div>
    </div>

    <!-- 8. DYNAMIC VIDEO PLAYER OVERLAY -->
    <div id="normal-lawan-overlay" class="video-overlay" style="display: none;">
        <video id="normalLawanVideo" playsinline controls>
            <source id="normalLawanSource" src="" type="video/mp4">
        </video>
        <div class="video-controls-bar">
            <button id="vbtn-play">▶️ Play</button>
            <button id="vbtn-pause">⏸️ Pause</button>
            <button id="vbtn-restart">🔄 Restart</button>
            <select id="videoSpeed">
                <option value="0.5">0.5x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
            </select>
        </div>
    </div>

    <!-- 9. SCENE 10 OVERLAY (QUIZ CATEGORIES) -->
    <div id="scene10-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2 id="quiz-title">Kuiz Penjagaan Haid</h2>
            <div class="button-group">
                <button id="btn-quiz-asas" class="main-btn">Asas</button>
                <button id="btn-quiz-penjagaan" class="main-btn">Penjagaan</button>
                <button id="btn-quiz-kesihatan" class="main-btn">Kesihatan & Kesedaran</button>
            </div>
        </div>
    </div>

    <!-- 10. SCENE 11 OVERLAY (QUIZ QUESTION SCREEN) -->
    <div id="scene11-overlay" class="overlay" style="display: none;">
        <div class="quiz-container">
            <div class="quiz-header">
                <span id="quiz-score">0/8</span>
            </div>
            <!-- BUKU LATIHAN DENGAN GARISAN -->
            <div id="quiz-question-text" class="notebook-lines"></div>
            <div class="quiz-options">
                <button id="opt-a" class="option-btn">A</button>
                <button id="opt-b" class="option-btn">B</button>
                <button id="opt-c" class="option-btn">C</button>
                <button id="opt-d" class="option-btn">D</button>
            </div>
        </div>
    </div>

    <!-- 11. SCENE 12 OVERLAY (QUIZ RESULT) -->
    <div id="scene12-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h1 id="result-congrats">Tahniah!</h1>
            <p id="result-score-label">Skor anda:</p>
            <h2 id="final-score-val">0 / 8</h2>
            <p id="result-motto">Usaha tangga kejayaan!</p>
        </div>
    </div>

    <!-- 12. SETTINGS OVERLAY -->
    <div id="settings-overlay" class="overlay" style="display: none;">
        <div class="card">
            <h2 id="settings-title">Tetapan</h2>
            
            <div class="setting-item">
                <span id="label-audio">Audio</span>
                <input type="range" id="volume-slider" min="0" max="100" value="70">
                <span id="volume-percentage">70%</span>
                <div class="control-row">
                    <button id="btn-volume-up" class="small-btn"><span id="text-volume-up">Kuatkan</span></button>
                    <button id="btn-volume-down" class="small-btn"><span id="text-volume-down">Perlahankan</span></button>
                    <button id="btn-mute" class="small-btn"><span id="text-mute">Senyap</span></button>
                </div>
            </div>

            <div class="setting-item">
                <span id="label-language">Bahasa</span>
                <div class="control-row">
                    <button id="btn-set-bm" class="small-btn"><span id="text-lang-bm">Bahasa Melayu</span></button>
                    <button id="btn-set-en" class="small-btn"><span id="text-lang-en">English</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL POP-UP (PERTUNJUK / MAKLUMAT JAWAPAN) -->
    <div id="quiz-modal-overlay" class="overlay" style="display: none;">
        <div class="card modal-card">
            <div id="modal-icon-elem" class="modal-icon">💡</div>
            <h2 id="modal-title-elem">Petunjuk</h2>
            <p id="modal-msg-elem">Mesej petunjuk di sini.</p>
            <button id="modal-close-btn" class="main-btn">TERUSKAN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
